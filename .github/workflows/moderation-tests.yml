name: Mr H Media Moderation Tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'v8.py'
      - 'static/app.js'
      - 'static/v8.js'
      - 'tests/test_v8.py'
      - '.github/workflows/moderation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moderation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Check Python syntax
        run: python -m py_compile app.py v8.py
      - name: Check browser syntax
        run: |
          node --check static/app.js
          node --check static/v8.js
      - name: Run backend moderation regression tests
        run: python -m pytest -q tests/test_v8.py
